name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish package
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Release tag ${RELEASE_TAG} must match package version ${expected_tag}."
            exit 1
          fi

      - name: Check npm publication
        id: npm-publication
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if npm view "pi-gentic@${package_version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "pi-gentic@${package_version} is already published."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "pi-gentic@${package_version} is not published yet."
          fi

      - name: Publish package
        if: steps.npm-publication.outputs.published == 'false'
        run: npm publish
